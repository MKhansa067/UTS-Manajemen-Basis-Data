services:
  # Database PostgreSQL; konfigurasi dan kredensial dibaca dari .env.
  postgres:
    image: postgres:${PG_VERSION}
    container_name: postgres_${NAMA}
    ports:
      - "${PG_EXTERNAL_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      BACKEND_DEV_PASSWORD: ${BACKEND_DEV_PASSWORD}
      BI_DEV_PASSWORD: ${BI_DEV_PASSWORD}
      DATA_ENGINEER_PASSWORD: ${DATA_ENGINEER_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    networks:
      - net_mkk
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Antarmuka pgAdmin; terhubung ke PostgreSQL melalui jaringan internal Docker.
  pgadmin:
    image: ${PGADMIN_IMAGE}
    container_name: pgadmin_${NAMA}
    ports:
      - "${PGADMIN_EXTERNAL_PORT}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - net_mkk
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

# Named volume menjaga data saat container dibuat ulang.
volumes:
  postgres_data:
  pgadmin_data:

# Jaringan eksplisit untuk komunikasi antarlayanan dengan hostname service.
networks:
  net_mkk:
    name: net_mkk
